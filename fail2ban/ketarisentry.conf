# Fail2ban Filter Specification for Ketarisentry
# Copy this file to: /etc/fail2ban/filter.d/ketarisentry.conf

[Definition]
failregex = ^<HOST> - - \[.*\] \[FAIL2BAN\] (AUTH_FAIL|RATE_LIMIT) IP=<HOST>
            ^.* \[FAIL2BAN\] (AUTH_FAIL|RATE_LIMIT) IP=<HOST>

ignoreregex =

# Example jail.local snippet:
# [ketarisentry]
# enabled  = true
# port     = http,https,3001
# filter   = ketarisentry
# logpath  = /var/log/ketarisentry/auth.log
# maxretry = 5
# findtime = 600
# bantime  = 3600
