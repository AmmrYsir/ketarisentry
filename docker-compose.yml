version: '3.8'

services:
  ketarisentry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ketarisentry-hub
    restart: unless-stopped
    # Load environment variables dynamically from local .env file
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
      - "5173:5173"
    environment:
      - PORT=${PORT:-3001}
      - VITE_APP_ENV=${VITE_APP_ENV:-production}
      - DB_PATH=${DB_PATH:-database/ketarisentry.db}
    volumes:
      # Persistent SQLite database & Fail2ban auth log directories
      - ketarisentry-db:/app/database
      - ketarisentry-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bun --version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  ketarisentry-db:
    driver: local
  ketarisentry-logs:
    driver: local
